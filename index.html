      rel="stylesheet"
    />

    <script>
      // Resolve the theme BEFORE first paint, or the page flashes dark then
      // repaints light for anyone who chose light. Mirrors useTheme()'s rules.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersLight =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = saved === "light" || saved === "dark" ? saved : prefersLight ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* private mode / storage disabled — the dark default in the markup stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    </noscript>
